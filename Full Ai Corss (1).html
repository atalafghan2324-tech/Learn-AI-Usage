<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Full Ai Corss</title>
<style>
:root{--bg:#f3f5fb;--cd:#fff;--tx:#181b27;--mu:#667085;--ac:#6c4cf5;--bd:#e2e5f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1119;--cd:#1a1d2a;--tx:#eef0f8;--mu:#9aa1b5;--bd:#2b2f42}}
:root[data-theme="dark"]{--bg:#0f1119;--cd:#1a1d2a;--tx:#eef0f8;--mu:#9aa1b5;--bd:#2b2f42}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;line-height:1.8}
button{font:inherit;color:inherit;cursor:pointer}
#splash{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#1b1464,#6c4cf5 55%,#e0489b);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#splash svg{width:230px;max-width:70%}
#splash h1{font-family:"Segoe UI",sans-serif;font-size:34px;margin:12px 0 0}
#splash p{opacity:.9;margin:4px 0 22px}
.go{background:#fff;color:#4a2fd0;border:0;border-radius:30px;padding:12px 38px;font-size:17px;font-weight:bold}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--cd);border-bottom:1px solid var(--bd)}
.bar b{flex:1;font-family:"Segoe UI",sans-serif;font-size:18px}
.ib{background:none;border:0;font-size:24px;padding:0 4px}
#drawer{position:fixed;top:0;bottom:0;right:0;width:260px;max-width:80%;background:var(--cd);z-index:40;padding:calc(env(safe-area-inset-top,0px) + 20px) 14px 20px;transform:translateX(105%);transition:transform .25s;border-left:1px solid var(--bd)}
#drawer.o{transform:none}
#shade{position:fixed;inset:0;background:#0007;z-index:30;display:none}
#drawer button{display:block;width:100%;text-align:right;background:none;border:0;padding:12px 8px;font-size:16px;border-radius:10px}
#drawer button:active{background:var(--bg)}
.wrap{max-width:760px;margin:auto;padding:12px 14px 40px}
.hero{border-radius:20px;padding:18px;color:#fff;background:linear-gradient(120deg,#6c4cf5,#e0489b);margin-bottom:12px}
.hero h2{margin:0;font-size:19px}.hero p{margin:4px 0 0;font-size:14px;opacity:.95}
.in{width:100%;padding:12px 16px;border-radius:14px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font:inherit;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.tile{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:14px 6px;text-align:center}
.im{border-radius:22%;object-fit:cover;vertical-align:middle;margin-inline-end:8px}.tile .im{display:block;width:54px;height:54px;margin:0 auto 6px}.ic{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:27px;margin:0 auto 6px;color:#fff}
.tile b{font-family:"Segoe UI",sans-serif;font-size:13px;direction:ltr;display:block}
.box{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.box h3{margin:0 0 6px;font-size:16px}.box p{margin:0;font-size:15px}
ol,ul{margin:0;padding-inline-start:22px;font-size:15px}
.ban{border-radius:18px;overflow:hidden;margin-bottom:12px}.ban svg{display:block;width:100%}
.ex{background:var(--bg);border-radius:10px;padding:10px 12px;direction:ltr;text-align:left;font-family:"Segoe UI",sans-serif;font-size:14px;white-space:pre-wrap}
.btn{display:inline-block;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-size:14px;text-decoration:none;margin:6px 0 0 6px}
.btn.o{background:none;color:var(--ac);border:1px solid var(--ac)}
.q{display:block;width:100%;text-align:right;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;margin-bottom:8px;font-size:15px}
.chat{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:5}
.m{max-width:88%;padding:10px 14px;border-radius:16px;margin:8px 0;font-size:15px;white-space:pre-line}
.m.u{background:var(--ac);color:#fff;margin-inline-start:auto;border-end-start-radius:4px}
.m.a{background:var(--cd);border:1px solid var(--bd);border-end-end-radius:4px}
.pp{display:flex;gap:12px;align-items:center}.pp .ic{margin:0;flex:none;border-radius:50%}

*{font-weight:700}
:root{--on:#fff;--at:#6c4cf5}
#splash{padding:0;background:#050a1a;justify-content:flex-end}
#splash>img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover}
.sp{position:relative;width:100%;padding:90px 24px calc(34px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#050a1af0 65%)}
.sp h1{margin:0;text-shadow:0 0 18px #2b8cff}
.sp .go{background:linear-gradient(90deg,#1e90ff,#00d4ff);color:#fff;box-shadow:0 0 22px #1e90ff99}
body.th .bar{background:var(--ac);color:var(--on);border-color:var(--ac)}
.box h3{color:var(--at)}
.btn{color:var(--on)}.btn.o{background:none;color:var(--at);border:1px solid var(--at)}
.m.u{color:var(--on)}
.q{border-inline-start:5px solid var(--ac)}
.qt{margin:18px 0 8px;font-size:17px;color:var(--at)}
.s0 .box{border-radius:22px;border:2px solid var(--ac)}
.s1 .box{border-radius:6px;border-inline-start:8px solid var(--ac)}
.s2 .box{background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 18%,var(--cd)),var(--cd));border-color:transparent;border-radius:18px}
.s3 .box{border:2px dashed var(--ac);border-radius:14px;background:transparent}
.s4 .box{border-radius:30px;padding:16px 22px;border-color:var(--ac)}
.s4 .box h3{display:inline-block;background:var(--ac);color:var(--on);padding:0 16px;border-radius:20px}
.s5 .box{border:0;box-shadow:0 6px 18px color-mix(in srgb,var(--ac) 40%,transparent);border-radius:16px}
.s5 .box h3{display:inline-block;border-bottom:3px solid var(--ac)}
.essay{border:2px solid #6c4cf5;border-radius:22px;padding:18px 18px 8px;background:linear-gradient(180deg,color-mix(in srgb,#6c4cf5 10%,var(--cd)),var(--cd))}
.essay h2{text-align:center;margin:0 0 4px;font-size:21px;color:var(--at)}
.essay .orn{text-align:center;color:#e0489b;letter-spacing:8px;margin-bottom:10px}
.essay p{font-size:16px;line-height:2.15;text-align:justify;margin:0 0 12px}
.essay h4{margin:6px 0;font-size:16px;color:var(--at)}
.essay ul{margin-bottom:12px;line-height:2}
.tm{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}.pc{text-align:center;width:130px}.pc img{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid #6c4cf5;display:block;margin:0 auto 6px}.pc span{font-size:14px;display:block;line-height:1.6}
.essay{padding:12px 14px 6px;border:0;box-shadow:0 8px 26px #6c4cf544;background:linear-gradient(180deg,color-mix(in srgb,#6c4cf5 8%,var(--cd)),var(--cd))}
.eh{background:linear-gradient(120deg,#1b1464,#6c4cf5 55%,#e0489b);color:#fff;border-radius:16px;padding:16px 12px;text-align:center;margin-bottom:14px}
.eh h2{color:#fff;font-size:25px;margin:0}.eh small{display:block;opacity:.92;font-size:13px;margin-top:2px}
.essay .lead{border-inline-start:4px solid #e0489b;padding-inline-start:12px}
.essay h4{font-size:17px;margin:14px 0 6px}
.flow{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;margin:8px 0 12px}
.flow span{background:color-mix(in srgb,#6c4cf5 16%,var(--cd));border:1px solid #6c4cf5;border-radius:20px;padding:3px 12px;font-size:14px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.cards div{border-radius:14px;padding:10px;font-size:13px;line-height:1.8;background:var(--bg);border-top:4px solid #6c4cf5}
.cards div:nth-child(2){border-color:#e0489b}.cards div:nth-child(3){border-color:#00c4cc}.cards div:nth-child(4){border-color:#ff7a00}
.cards b{display:block;font-size:14px;color:var(--at)}
.tl{border-inline-start:3px solid #6c4cf5;padding-inline-start:14px;margin:8px 8px 14px}
.tl div{position:relative;margin-bottom:10px;font-size:14.5px;line-height:1.9}
.tl div::before{content:"";position:absolute;inset-inline-start:-22px;top:10px;width:11px;height:11px;border-radius:50%;background:#e0489b}
.tl b{color:var(--at)}
.note{background:color-mix(in srgb,#eab308 20%,var(--cd));border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.9;margin-bottom:12px}
.fin{text-align:center;font-size:16px;color:var(--at);padding:6px 0 10px}</style>
</head>

var ez=E('div','essay');ez.innerHTML='<div class="eh"><h2>❖ ښه راغلاست ❖</h2><small>د پوهې، ټکنالوژۍ او مصنوعي ځیرکتیا ګلستان ته</small></div><p class="lead">مصنوعي ځیرکتیا (Artificial Intelligence) د کمپیوټر علم هغه څانګه ده چې ماشین ته د زده کړې، استدلال، تحلیل، ژباړې، ډیزاین او لیکلو وړتیا ورکوي. دا وسیله د انسان د عقل ځای نه نیسي، بلکې د هغه ګړندی او ځیرک مرستیال ده.</p><div class="orn">✦ ✦ ✦</div><h4>🔬 مصنوعي ځیرکتیا څنګه کار کوي؟</h4><p>AI د لویو معلوماتو (Data) له څیړلو څخه زده کوي. لومړی ډیر ډیټا ورکول کیږي، بیا الګوریتم په هغې کې نمونې (Patterns) پیدا کوي، او پایله کې یو ماډل جوړیږي چې نوې پوښتنې ته ځواب ورکولی شي. دې بهیر ته ماشیني زده کړه (Machine Learning) وایي.</p><div class="flow"><span>📥 ډیټا</span>←<span>🧩 زده کړه</span>←<span>🤖 ماډل</span>←<span>💬 ځواب</span></div><h4>🧬 مهمې څانګې</h4><div class="cards"><div><b>ماشیني زده کړه</b>Machine Learning: له ډیټا څخه د نمونو زده کړه.</div><div><b>ژوره زده کړه</b>Deep Learning: د مصنوعي عصبي شبکو له لارې زده کړه.</div><div><b>د ژبې پروسس</b>NLP: د انساني ژبې پوهیدل، ژباړه او لیکل.</div><div><b>کمپیوټري لید</b>Computer Vision: د عکس او ویډیو پیژندل.</div></div><h4>⏳ لنډ تاریخ</h4><div class="tl"><div><b>۱۹۵۰:</b> ایلن ټیورینګ پوښتنه وکړه چې ایا ماشین فکر کولی شي؟</div><div><b>۱۹۵۶:</b> د «Artificial Intelligence» اصطلاح د Dartmouth په علمي غونډه کې رامنځته شوه.</div><div><b>د ۲۰۱۰ لسیزه:</b> ژوره زده کړه او لوی ډیټا د AI وده ګړندې کړه.</div><div><b>۲۰۲۲ وروسته:</b> جنراتیو AI، یعنې د متن، عکس، ویډیو او غږ جوړول، عامو خلکو ته ورسیده.</div></div><div class="note">⚠️ <b>علمي پام:</b> AI ځینې وخت ناسم ځواب هم ورکوي، نو مهم معلومات تل له باوري سرچینو سره پرتله کړئ.</div><div class="fin">پوهه رڼا ده او پوښتنه یې کیلي ✦ پدې ایپ کې ۱۷ برنامې په ساده پښتو زده کړئ</div>';v.appendChild(ez);
